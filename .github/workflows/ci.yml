name: CI - Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir --no-compile -r requirements.txt

      - name: Start ChromaDB for retrieval tests
        run: |
          docker compose up -d chromadb
          sleep 15

      - name: Run unit tests with coverage
        env:
          OPENAI_API_KEY: test-openai-key
          COHERE_API_KEY: test-cohere-key
        run: pytest tests/ -v --cov=src --cov-report=term --ignore=tests/test_evaluation.py

      - name: Stop services
        if: always()
        run: docker compose down

  evaluate:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk before service build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.cache/pip
          docker system prune -af
          df -h

      - name: Start services
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          docker compose up -d
          sleep 15

      - name: Ingest demo documents
        run: bash scripts/ingest_demo_docs.sh

      - name: Run evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: bash scripts/run_evaluation.sh

      - name: Check quality thresholds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python3 scripts/check_quality_gate.py

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down
